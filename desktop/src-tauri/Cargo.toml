[package]
name = "xiexie-desktop"
version = "0.1.0"
description = "Xiexie — voice-first AI grandchild for seniors"
authors = ["Edouard Foussier"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 core. ``tray-icon`` enables the menu-bar tray; ``image-png``
# lets us load the tray glyph from PNG bytes; ``macos-private-api`` is
# needed for the borderless transparent NSWindow we want for the panel.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# Single-instance plugin: a second double-click on the .app re-shows the
# existing window instead of spawning a second backend (which would
# collide on port 8787 and confuse the user).
tauri-plugin-single-instance = "2"

# Tiny blocking HTTP client used solely for the backend health-check
# loop. ``ureq`` keeps the Rust side dependency-light vs. pulling in
# tokio + reqwest just for one GET request.
ureq = { version = "2", default-features = false, features = ["tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# POSIX kill(2) for graceful child shutdown (SIGTERM → 5 s wait → SIGKILL).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
