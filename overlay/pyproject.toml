[project]
name = "xiexie-overlay"
version = "0.1.0"
description = "macOS desktop overlay glyph for Xiexie scam-shield alerts."
readme = "../OVERLAY_README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edouard Foussier" }]
dependencies = [
    "PyQt6>=6.7",
    "websockets>=14",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
xiexie-overlay = "overlay.__main__:main"
xiexie-overlay-demo = "overlay.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
